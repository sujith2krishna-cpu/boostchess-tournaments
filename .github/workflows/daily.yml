name: Daily tournament data

# Runs every 3 hours (at minute 17, off the busy full hour) and on the "Run workflow" button.
# Each source is fetched at most once every 12 hours, so most runs only test, publish and
# check; they finish quickly. The data is committed only when something real changed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch every source now, ignoring the 12-hour rule (a deliberate manual refresh)"
        type: boolean
        default: false

# One run at a time; a run that is already going is never cancelled half way.
concurrency:
  group: daily-tournament-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # push the data commit
      pages: write      # configure-pages
    outputs:
      published: ${{ steps.upload.outcome == 'success' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Tests come first: if one fails, nothing is fetched and nothing is committed.
      - name: Run the tests
        run: python -m pytest -q

      # For the missed-fetch alarm: what meta.json said before this run, and when the run began.
      - name: Remember meta.json from before the build
        run: |
          if [ -f data/meta.json ]; then cp data/meta.json "$RUNNER_TEMP/meta-before.json"; fi
          echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"

      - name: Build the data (reads the sources)
        id: build
        env:
          # only a manual run with the box ticked; the schedule never forces
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/build_events.py "${args[@]}"

      # Only data/ is ever committed, and only when something real changed.
      - name: Commit the data
        id: commit
        if: steps.build.outputs.real_changes == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.build.outputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --name-only | grep -qv '^data/'; then
            echo "::error::Refusing to commit anything outside data/"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Say what was committed
        if: steps.build.outcome == 'success'
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$COMMITTED" = "true" ]; then
            echo "**Committed to main:** yes (\`$SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Committed to main:** no (nothing changed except timestamps)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The website data is published whether or not anything was committed.
      - name: Configure Pages
        if: steps.build.outcome == 'success'
        uses: actions/configure-pages@v6

      - name: Upload data/ for Pages
        id: upload
        if: steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: data

      # Last, so the data is still published when it fails: the run fails (and GitHub
      # e-mails you) when the newest fetch of any source is over 30 hours old, when
      # one source has had no successful fetch for 3 days, or when a source was due for
      # more than 6 hours without a fetch attempt (GitHub skipped scheduled runs).
      - name: Heartbeat (stale data 30 h, silent source 3 days, missed fetch 6 h)
        if: steps.build.outcome == 'success'
        run: >-
          python scripts/heartbeat.py --summary-file "$GITHUB_STEP_SUMMARY"
          --before "$RUNNER_TEMP/meta-before.json" --started "$RUN_STARTED"

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check out the repository (for the check script)
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Check the published files (events, meta, quality, review list; schema version, CORS header)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_published.py "$PAGE_URL" --summary-file "$GITHUB_STEP_SUMMARY"

  # Urgent alerts: after every run, open (or reopen) one issue per problem at once (a source that
  # failed 2 runs in a row, or this run failing), and close it after 2 runs without the problem.
  # It only reads data/ from main and writes issues; it never changes data or publishes anything.
  alerts:
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out main (with this run's data commit, if any)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Open or close data alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: python scripts/health.py alerts --build "$BUILD_RESULT" --deploy "$DEPLOY_RESULT"
