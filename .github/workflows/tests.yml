name: Tests

# Runs the full test suite on every pull request to main, and on the "Run workflow" button.
# It only reads: no live sites (the tests use a fake web and fail on any real connection),
# no secrets, no commit, no publishing. The daily data workflow (daily.yml) is separate and
# has its own concurrency group, so this never waits for it or stops it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces the older test run.
concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q
